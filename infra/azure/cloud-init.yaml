#cloud-config
# Provisions the Meet SFU on a fresh Ubuntu VM: Docker, the repo, generated
# secrets, and the Compose stack (SFU + coturn + Caddy for TLS).
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - ufw

write_files:
  - path: /etc/sysctl.d/99-meet.conf
    content: |
      # A busy SFU holds thousands of UDP flows; the defaults are far too small
      # and manifest as unexplained packet loss rather than an obvious error.
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216
      net.core.netdev_max_backlog = 5000
      net.ipv4.udp_rmem_min = 8192
      net.ipv4.udp_wmem_min = 8192
      fs.file-max = 200000

  - path: /opt/meet/domain
    content: |
      __MEET_DOMAIN__

  # Every hostname this deployment answers on, comma separated — the current
  # domain plus any it used to be reached by. It lives here, next to the domain,
  # rather than only in the generated .env, because the bootstrap rewrites that
  # file from scratch every run: a name kept only there is retired by the next
  # deploy, and every link already shared on it breaks silently.
  - path: /opt/meet/site-addresses
    content: |
      __MEET_DOMAIN__

  - path: /opt/meet/bootstrap.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec > >(tee -a /var/log/meet-bootstrap.log) 2>&1
      echo "[meet] bootstrap starting $(date -Is)"

      # IMDS reports an empty publicIpAddress for Standard-SKU addresses in some
      # configurations, so fall back to an external reflector. Getting this wrong
      # produces a meeting that signals fine and shows only black tiles, because
      # this value is what remote browsers send their RTP to.
      PUBLIC_IP="$(curl -s --max-time 10 -H Metadata:true --noproxy '*' \
        'http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/publicIpAddress?api-version=2021-02-01&format=text' || true)"
      if [ -z "$PUBLIC_IP" ]; then
        PUBLIC_IP="$(curl -s --max-time 10 https://api.ipify.org || true)"
      fi
      if [ -z "$PUBLIC_IP" ]; then
        echo "[meet] FATAL: could not determine the public IP" >&2
        exit 1
      fi
      FQDN="$(curl -s -H Metadata:true --noproxy '*' \
        'http://169.254.169.254/metadata/instance/compute/name?api-version=2021-02-01&format=text')"
      DOMAIN="$(tr -d '[:space:]' < /opt/meet/domain 2>/dev/null || echo '')"
      # Every name this deployment answers on, not just the current one. A
      # hostname that survives only in the generated .env would be retired by
      # this very script the next time it runs.
      #
      # Caddy separates site addresses with whitespace and refuses a bare comma
      # outright — it will not start, so a stray comma here takes the whole site
      # down rather than degrading it. Commas in the file are accepted and
      # normalised away; CORS wants them back, without the spaces.
      SITES="$(tr ',' ' ' < /opt/meet/site-addresses 2>/dev/null | xargs || echo '')"
      [ -n "$SITES" ] || SITES="$DOMAIN"
      SITE_ADDRESSES="$SITES"
      CORS_ORIGINS="$(printf '%s\n' $SITES | sed 's|^|https://|' | paste -sd, -)"
      echo "[meet] public ip=$PUBLIC_IP fqdn=$FQDN domain=$DOMAIN serving='$SITE_ADDRESSES'"

      cd /opt/meet
      if [ ! -d repo/.git ]; then
        git clone --depth 1 https://github.com/Deodat-Lawson/Meet.git repo
      else
        git -C repo fetch --depth 1 origin main && git -C repo reset --hard origin/main
      fi

      # Secrets are generated on the box and never leave it.
      if [ ! -f /opt/meet/secrets.env ]; then
        {
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
          echo "TURN_PASSWORD=$(openssl rand -base64 24 | tr -d '\n/+=')"
        } > /opt/meet/secrets.env
        chmod 600 /opt/meet/secrets.env
      fi
      . /opt/meet/secrets.env

      printf '%s\n' \
        "PUBLIC_IP=${PUBLIC_IP}" \
        "DOMAIN=${DOMAIN}" \
        "SITE_ADDRESSES=${SITE_ADDRESSES}" \
        "JWT_SECRET=${JWT_SECRET}" \
        "TURN_USERNAME=meet" \
        "TURN_PASSWORD=${TURN_PASSWORD}" \
        "CORS_ORIGINS=${CORS_ORIGINS}" \
        "ROOM_MAX_PEERS=50" \
        "RECORDING_ENABLED=false" \
        "MEDIASOUP_WORKERS=2" \
        "LOG_LEVEL=info" \
        > repo/infra/.env
      chmod 600 repo/infra/.env

      cd repo/infra
      docker compose pull --ignore-buildable || true
      docker compose up -d --build
      echo "[meet] bootstrap done $(date -Is)"

runcmd:
  - sysctl --system
  # Docker from the official repo; Ubuntu's packaged version lags badly.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - /opt/meet/bootstrap.sh
