appId: online.hideme.desktop
productName: Hide Me
copyright: Hide Me

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - static/**/*
  - package.json

mac:
  category: public.app-category.business
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  # Hardened runtime requires entitlements for capture; harmless when unsigned.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # macOS refuses camera, microphone and screen capture unless the binary
  # declares why it wants them. Without these the app launches and every
  # media call fails silently.
  extendInfo:
    NSCameraUsageDescription: Hide Me uses your camera so other participants can see you.
    NSMicrophoneUsageDescription: Hide Me uses your microphone so other participants can hear you.
    NSScreenCaptureUsageDescription: Hide Me captures your screen when you choose to share it in a meeting.
    LSMinimumSystemVersion: "11.0"
  # No Developer ID in this environment; produce an unsigned build rather than
  # failing. Set CSC_LINK/CSC_KEY_PASSWORD to sign.
  identity: null

dmg:
  # No space: the volume mounts at /Volumes/<title>, and electron-builder does
  # not quote that path when it calls `hdiutil detach`, so a space makes the
  # detach fail and takes the whole build with it.
  title: "HideMe-${version}"
  icon: build/icon.icns
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 400
