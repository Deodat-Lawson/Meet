<!doctype html>
<!-- Screen-share source chooser, used on macOS versions without a system picker. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Choose what to share</title>
    <style>
      :root {
        --bg: #16191f; --surface: #1d2129; --border: #2c313b;
        --text: #eef1f6; --dim: #9aa3b2; --accent: #2d8cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        background: var(--bg); color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
      }
      h1 { margin: 0; padding: 16px 18px 10px; font-size: 15px; font-weight: 650; }
      .tabs { display: flex; gap: 6px; padding: 0 18px 12px; }
      .tab {
        padding: 5px 12px; border-radius: 6px; background: transparent;
        border: 1px solid var(--border); color: var(--dim); font: inherit; cursor: pointer;
      }
      .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
      .grid {
        flex: 1; overflow-y: auto; padding: 0 18px 12px;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start;
      }
      .item {
        background: var(--surface); border: 2px solid transparent; border-radius: 10px;
        padding: 8px; cursor: pointer; text-align: left;
      }
      .item:hover { border-color: #3a4150; }
      .item.selected { border-color: var(--accent); }
      .item img.thumb {
        width: 100%; aspect-ratio: 16/10; object-fit: contain;
        background: #000; border-radius: 6px; display: block;
      }
      .label { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
      .label img { width: 15px; height: 15px; border-radius: 3px; }
      .label span {
        font-size: 12px; color: var(--text);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      footer {
        display: flex; justify-content: flex-end; gap: 8px;
        padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface);
      }
      button.action {
        height: 30px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--border);
        background: #262b35; color: var(--text); font: inherit; cursor: pointer;
      }
      button.action.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.action:disabled { opacity: .45; cursor: not-allowed; }
      .empty { grid-column: 1/-1; text-align: center; color: var(--dim); padding: 40px 0; }
    </style>
  </head>
  <body>
    <h1>Choose what to share</h1>
    <div class="tabs">
      <button class="tab active" data-filter="screen">Entire Screen</button>
      <button class="tab" data-filter="window">Application Window</button>
    </div>
    <div class="grid" id="grid"></div>
    <footer>
      <button class="action" id="cancel">Cancel</button>
      <button class="action primary" id="share" disabled>Share</button>
    </footer>

    <script>
      const api = window.meetPicker;
      let sources = [];
      let filter = 'screen';
      let selected = null;

      const grid = document.getElementById('grid');
      const shareBtn = document.getElementById('share');

      function render() {
        const shown = sources.filter((s) => (filter === 'screen' ? s.isScreen : !s.isScreen));
        grid.innerHTML = '';
        if (shown.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = filter === 'screen' ? 'No screens available.' : 'No open windows.';
          grid.appendChild(empty);
          return;
        }
        for (const s of shown) {
          const item = document.createElement('button');
          item.className = 'item' + (selected === s.id ? ' selected' : '');
          item.onclick = () => { selected = s.id; shareBtn.disabled = false; render(); };
          item.ondblclick = () => api.choose(s.id);

          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = s.thumbnail;
          item.appendChild(img);

          const label = document.createElement('div');
          label.className = 'label';
          if (s.icon) { const i = document.createElement('img'); i.src = s.icon; label.appendChild(i); }
          const name = document.createElement('span');
          name.textContent = s.name;
          label.appendChild(name);
          item.appendChild(label);

          grid.appendChild(item);
        }
      }

      for (const tab of document.querySelectorAll('.tab')) {
        tab.onclick = () => {
          filter = tab.dataset.filter;
          for (const t of document.querySelectorAll('.tab')) t.classList.toggle('active', t === tab);
          selected = null;
          shareBtn.disabled = true;
          render();
        };
      }

      document.getElementById('cancel').onclick = () => api.choose(null);
      shareBtn.onclick = () => selected && api.choose(selected);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') api.choose(null); });

      api.list().then((list) => {
        sources = list;
        // Open on whichever tab actually has something in it.
        if (!sources.some((s) => s.isScreen)) {
          filter = 'window';
          document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.filter === 'window'));
        }
        render();
      });
    </script>
  </body>
</html>
