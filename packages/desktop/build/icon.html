<!doctype html>
<!--
  Source artwork for the macOS app icon, rendered headlessly to a 1024px PNG.

  Drawn to macOS conventions rather than reusing the favicon: a squircle rather
  than a rounded rect, a top-lit gradient, a fine inner bevel, and a grounding
  shadow — the cues that make an icon sit correctly next to Apple's own in the
  Dock. The glyph is the camera body plus lens wedge from the web app's mark, so
  the family still reads as one product.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 1024px; height: 1024px; background: transparent; }
      .canvas { position: relative; width: 1024px; height: 1024px; }

      /* Apple's icon grid insets the shape ~10% so it optically matches siblings. */
      .tile {
        position: absolute;
        left: 92px; top: 76px;
        width: 840px; height: 840px;
        background: linear-gradient(168deg, #5aa9ff 0%, #2d8cff 42%, #1567d8 100%);
        /* Squircle, not a rounded rectangle. */
        border-radius: 224px;
        box-shadow:
          0 26px 60px rgba(8, 30, 68, 0.42),
          0 6px 14px rgba(8, 30, 68, 0.26);
        overflow: hidden;
      }

      /* Specular sheen across the upper third. */
      .tile::before {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.06) 38%, rgba(255,255,255,0) 62%);
      }
      /* Inner bevel: light on the top edge, shadow on the bottom. */
      .tile::after {
        content: '';
        position: absolute; inset: 0;
        border-radius: 224px;
        box-shadow:
          inset 0 3px 4px rgba(255,255,255,0.5),
          inset 0 -5px 12px rgba(3, 38, 92, 0.36);
      }

      .glyph {
        position: absolute;
        left: 0; top: 0; right: 0; bottom: 0;
        display: flex; align-items: center; justify-content: center;
      }
      svg { filter: drop-shadow(0 10px 16px rgba(4, 28, 70, 0.34)); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="tile">
        <div class="glyph">
          <svg width="470" height="470" viewBox="0 0 100 100" fill="none">
            <!-- Camera body -->
            <rect x="14" y="31" width="47" height="38" rx="10" fill="#ffffff" />
            <!-- Lens wedge -->
            <path d="M67 45.5 L86 33.5 v33 L67 54.5 z" fill="#ffffff" />
            <!-- Subtle cut in the body so the mark reads at 32px -->
            <circle cx="30" cy="50" r="6.5" fill="#2d8cff" opacity="0.16" />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
