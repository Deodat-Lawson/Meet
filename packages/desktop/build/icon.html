<!doctype html>
<!--
  Source artwork for the app icon, rendered headlessly to a 1024px PNG.

  A padlock silhouette with a camera lens set into its body. The padlock is
  chosen over subtler privacy motifs because it is the only shape that survives
  16px in a menu bar — a keyhole reads as a lightbulb and an aperture reads as a
  circle at that size, both of which were tried and discarded. The lens and its
  wedge keep it specific to video rather than generic security.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 1024px; height: 1024px; background: transparent; }
      .canvas { position: relative; width: 1024px; height: 1024px; }
      .tile {
        position: absolute;
        left: 92px; top: 76px;
        width: 840px; height: 840px;
        background: linear-gradient(165deg, #7b5cff 0%, #4c2fd6 46%, #25128a 100%);
        border-radius: 224px;
        box-shadow: 0 26px 60px rgba(14, 6, 54, .46), 0 6px 14px rgba(14, 6, 54, .3);
        overflow: hidden;
      }
      .tile::before {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.05) 40%, rgba(255,255,255,0) 62%);
      }
      .tile::after {
        content: ''; position: absolute; inset: 0; border-radius: 224px;
        box-shadow: inset 0 3px 4px rgba(255,255,255,.46), inset 0 -5px 12px rgba(10, 4, 44, .40);
      }
      .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      svg { filter: drop-shadow(0 10px 18px rgba(10, 4, 44, .38)); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="tile">
        <div class="glyph">
          <svg width="500" height="500" viewBox="0 0 100 100" fill="none">
            <!-- Lock body -->
            <rect x="18" y="44" width="64" height="46" rx="13" fill="#ffffff" />
            <!-- Shackle -->
            <path d="M31 44 V32 a19 19 0 0 1 38 0 v12" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
            <!-- Camera lens and wedge, cut out of the body -->
            <circle cx="46" cy="66" r="11" fill="#4c2fd6" />
            <path d="M60 60 l11 -7 v26 l-11 -7 z" fill="#4c2fd6" />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
