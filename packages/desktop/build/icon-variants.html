<!doctype html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; background:#0b0d12; font-family:-apple-system,BlinkMacSystemFont,sans-serif; padding:40px; }
.row { display:flex; gap:40px; }
.cell { text-align:center; }
.label { color:#9aa3b2; font-size:15px; margin-top:14px; font-weight:600; }
.small { color:#6b7382; font-size:12px; margin-top:4px; }
.tile { position:relative; width:320px; height:320px; border-radius:84px; overflow:hidden; }
.tile::before { content:''; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.04) 40%,transparent 62%); }
.tile::after { content:''; position:absolute; inset:0; border-radius:84px;
  box-shadow: inset 0 2px 3px rgba(255,255,255,.40), inset 0 -4px 10px rgba(0,0,0,.42); }
.glyph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.d { background:linear-gradient(165deg,#7b5cff 0%,#4c2fd6 46%,#25128a 100%); }
.e { background:linear-gradient(165deg,#3a4256 0%,#1b2030 50%,#0a0d15 100%); }
.f { background:linear-gradient(165deg,#7b5cff 0%,#4c2fd6 46%,#25128a 100%); }
.mini { display:flex; gap:10px; align-items:center; justify-content:center; margin-top:12px; }
.mini .t { border-radius:9px; } .mini .t.s32{width:32px;height:32px;} .mini .t.s16{width:16px;height:16px;border-radius:5px;}
.mini .t .glyph svg { width:72%; height:72%; }
</style></head><body><div class="row">

<div class="cell">
  <div class="tile d"><div class="glyph">
    <svg width="190" height="190" viewBox="0 0 100 100">
      <rect x="8" y="28" width="56" height="44" rx="12" fill="#fff"/>
      <path d="M70 43 L88 32 v36 L70 57 z" fill="#fff"/>
      <circle cx="62" cy="68" r="21" fill="#25128a"/>
      <rect x="52" y="64" width="20" height="15" rx="4" fill="#fff"/>
      <path d="M56 64 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#fff" stroke-width="4"/>
    </svg>
  </div></div>
  <div class="label">D — Camera + lock badge</div><div class="small">violet</div>
  <div class="mini">
    <div class="t s32 tile d"><div class="glyph"><svg viewBox="0 0 100 100"><rect x="8" y="28" width="56" height="44" rx="12" fill="#fff"/><path d="M70 43 L88 32 v36 L70 57 z" fill="#fff"/><circle cx="62" cy="68" r="23" fill="#25128a"/><rect x="51" y="63" width="22" height="17" rx="5" fill="#fff"/><path d="M55.5 63 v-5 a6.5 6.5 0 0 1 13 0 v5" fill="none" stroke="#fff" stroke-width="5"/></svg></div></div>
    <div class="t s16 tile d"><div class="glyph"><svg viewBox="0 0 100 100"><rect x="8" y="28" width="56" height="44" rx="12" fill="#fff"/><path d="M70 43 L88 32 v36 L70 57 z" fill="#fff"/><circle cx="62" cy="68" r="25" fill="#25128a"/><rect x="50" y="62" width="24" height="19" rx="5" fill="#fff"/></svg></div></div>
  </div>
</div>

<div class="cell">
  <div class="tile e"><div class="glyph">
    <svg width="190" height="190" viewBox="0 0 100 100">
      <rect x="8" y="28" width="56" height="44" rx="12" fill="#fff"/>
      <path d="M70 43 L88 32 v36 L70 57 z" fill="#fff"/>
      <circle cx="62" cy="68" r="21" fill="#0a0d15"/>
      <rect x="52" y="64" width="20" height="15" rx="4" fill="#fff"/>
      <path d="M56 64 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#fff" stroke-width="4"/>
    </svg>
  </div></div>
  <div class="label">E — same, graphite</div><div class="small">serious / neutral</div>
  <div class="mini">
    <div class="t s32 tile e"><div class="glyph"><svg viewBox="0 0 100 100"><rect x="8" y="28" width="56" height="44" rx="12" fill="#fff"/><path d="M70 43 L88 32 v36 L70 57 z" fill="#fff"/><circle cx="62" cy="68" r="23" fill="#0a0d15"/><rect x="51" y="63" width="22" height="17" rx="5" fill="#fff"/><path d="M55.5 63 v-5 a6.5 6.5 0 0 1 13 0 v5" fill="none" stroke="#fff" stroke-width="5"/></svg></div></div>
    <div class="t s16 tile e"><div class="glyph"><svg viewBox="0 0 100 100"><rect x="8" y="28" width="56" height="44" rx="12" fill="#fff"/><path d="M70 43 L88 32 v36 L70 57 z" fill="#fff"/><circle cx="62" cy="68" r="25" fill="#0a0d15"/><rect x="50" y="62" width="24" height="19" rx="5" fill="#fff"/></svg></div></div>
  </div>
</div>

<div class="cell">
  <div class="tile f"><div class="glyph">
    <svg width="185" height="185" viewBox="0 0 100 100">
      <rect x="18" y="44" width="64" height="46" rx="13" fill="#fff"/>
      <path d="M31 44 V32 a19 19 0 0 1 38 0 v12" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
      <circle cx="50" cy="63" r="11" fill="#4c2fd6"/>
      <path d="M62 58 l11 -7 v24 l-11 -7 z" fill="#4c2fd6"/>
    </svg>
  </div></div>
  <div class="label">F — Lock with camera lens</div><div class="small">lock-first</div>
  <div class="mini">
    <div class="t s32 tile f"><div class="glyph"><svg viewBox="0 0 100 100"><rect x="18" y="44" width="64" height="46" rx="13" fill="#fff"/><path d="M31 44 V32 a19 19 0 0 1 38 0 v12" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><circle cx="50" cy="65" r="12" fill="#4c2fd6"/></svg></div></div>
    <div class="t s16 tile f"><div class="glyph"><svg viewBox="0 0 100 100"><rect x="18" y="44" width="64" height="46" rx="13" fill="#fff"/><path d="M31 44 V32 a19 19 0 0 1 38 0 v12" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><circle cx="50" cy="65" r="13" fill="#4c2fd6"/></svg></div></div>
  </div>
</div>

</div></body></html>
